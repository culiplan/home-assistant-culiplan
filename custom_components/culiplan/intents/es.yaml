          label: "{label}"
          duration_sec: "{duration_sec}"
  CuliplanCancelRecipeTimer:
    data:
      - sentences:
          - "cancelar el temporizador {label}"
          - "detener el temporizador {label}"
        slots:
          label: "{label}"

responses:
