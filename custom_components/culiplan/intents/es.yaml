# CuliplanAddToPantry (+ lists) added manually — pantry add via Assist.
language: "es"
lists:
  # Texto libre para el artículo; los intents integrados no exponen esta
  # lista a los archivos de frases personalizadas, así que se declara aquí.
  item:
    wildcard: true
  # Lugar de almacenamiento hablado → valor backend PantryStock.location.
  culiplan_location:
    values:
      - in: "(despensa|alacena|armario)"
        out: "pantry"
      - in: "(nevera|frigorífico|frigo|refrigerador|refri|heladera)"
        out: "fridge"
      - in: "congelador"
        out: "freezer"
      - in: "(encimera|mostrador)"
        out: "counter"
      - in: "(especiero|estante de especias)"
        out: "spice_rack"
intents:
  CuliplanWhatsDinnerTonight:
    data:
      - sentences:
          - "¿qué hay para cenar esta noche?"
          - "¿qué cocino hoy?"
          - "¿qué tengo planeado para hoy?"
  CuliplanGetWeekMeals:
    data:
      - sentences:
          - "¿qué está planeado esta semana?"
          - "¿qué cocino esta semana?"
          - "¿qué hay para mañana?"
  CuliplanGetShoppingList:
    data:
      - sentences:
          - "¿qué necesito comprar?"
          - "muéstrame mi lista de compras"
          - "¿qué hay en mi lista?"
  CuliplanAddToShoppingList:
    data:
      - sentences:
          - "agregar {item} a [mi] lista de compras"
          - "necesito comprar {item}"
          - "pon {item} en [mi] lista"
        slots:
          item: "{item}"
  CuliplanAddToPantry:
    data:
      - sentences:
          - "(añade|agrega|añadir|agregar|pon|mete) {item} (a la|al|a mi|en la|en el|en mi|a|en) {culiplan_location:location}"
          - "tengo {item} en (la|el|mi) {culiplan_location:location}"
        slots:
          item: "{item}"
      - sentences:
          - "(compré|he comprado) {item}"
        slots:
          item: "{item}"
          location: "pantry"
  CuliplanWhatsInPantry:
    data:
      - sentences:
          - "¿qué tengo en mi despensa?"
          - "¿qué tengo en casa?"
          - "¿qué puedo cocinar con lo que tengo?"
  CuliplanWhatsExpiringSoon:
    data:
      - sentences:
          - "¿qué vence pronto?"
          - "¿qué debo usar pronto?"
          - "¿qué está a punto de caducar?"
  CuliplanNextCookingStep:
    data:
      - sentences:
          - "siguiente paso"
          - "próximo paso"
          - "¿cuál es el siguiente paso?"
          - "continuar cocinando"
  CuliplanSetRecipeTimer:
    data:
      - sentences:
          - "iniciar el temporizador {label} [de] {duration_sec} segundos"
          - "iniciar el temporizador {label}"
          - "poner un temporizador {label} [de] {duration_sec} segundos"
          - "poner un temporizador para {label}"
