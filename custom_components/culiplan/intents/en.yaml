# Auto-generated by scripts/generate_intents.py — do not edit manually.
# Source: api.culiplan.com/api/voice/tools?tag=ha-assist:eligible&lang=en
# Phase 3 cooking-mode intents added manually (task-1397).
# CuliplanAddToPantry (+ lists) added manually — pantry add via Assist.
language: "en"
lists:
  # Free-text item name. The built-in intents don't expose this list to
  # custom sentence files, so declare the wildcard here.
  item:
    wildcard: true
  # Spoken storage location → backend PantryStock.location value.
  culiplan_location:
    values:
      - in: "(pantry|cupboard|larder|store cupboard|stock|inventory)"
        out: "pantry"
      - in: "(fridge|refrigerator)"
        out: "fridge"
      - in: "(freezer|deep freeze)"
        out: "freezer"
      - in: "(counter|countertop|worktop)"
        out: "counter"
      - in: "spice rack"
        out: "spice_rack"
intents:
  CuliplanWhatsDinnerTonight:
    data:
      - sentences:
          - "what's for dinner [tonight]"
          - "what am I cooking [today]"
          - "what's on the menu [today]"
          - "what did I plan for dinner"
          - "what's for lunch [today]"
  CuliplanGetWeekMeals:
    data:
      - sentences:
          - "what's planned this week"
          - "what am I cooking this week"
          - "show me this week's meal plan"
          - "what about tomorrow"
          - "what's for dinner tomorrow"
  CuliplanGetShoppingList:
    data:
      - sentences:
          - "what do I need to buy"
          - "show my shopping list"
          - "what's on my shopping list"
          - "what should I get at the store"
  CuliplanAddToShoppingList:
    data:
      - sentences:
          - "add {item} to [my] shopping list"
          - "I need to buy {item}"
          - "put {item} on [my] list"
        slots:
          item: "{item}"
  CuliplanAddToPantry:
    data:
      - sentences:
          - "add {item} to [the|my] {culiplan_location:location}"
          - "put {item} in [the|my] {culiplan_location:location}"
          - "I have {item} in [the|my] {culiplan_location:location}"
        slots:
          item: "{item}"
      - sentences:
          - "add {item} to [my] (stock|inventory|supplies)"
          - "I bought {item}"
        slots:
          item: "{item}"
          location: "pantry"
  CuliplanWhatsInPantry:
    data:
      - sentences:
          - "what's in my pantry"
          - "what do I have at home"
          - "what can I cook with what I have"
  CuliplanWhatsExpiringSoon:
    data:
      - sentences:
          - "what's expiring soon"
          - "what food is about to expire"
          - "what should I use up"
  CuliplanNextCookingStep:
    data:
      - sentences:
          - "next step"
          - "next cooking step"
          - "what's the next step"
          - "go to the next step"
          - "continue cooking"
  CuliplanSetRecipeTimer:
    data:
      - sentences:
          - "start [the] {label} timer [for] {duration_sec} seconds"
          - "start [the] {label} timer"
          - "set [a] {label} timer [for] {duration_sec} seconds"
          - "set [a] timer for {label}"
        slots:
          label: "{label}"
          duration_sec: "{duration_sec}"
  CuliplanCancelRecipeTimer:
    data:
      - sentences:
          - "cancel [the] {label} timer"
          - "stop [the] {label} timer"
        slots:
          label: "{label}"

responses:
  intents:
    CuliplanWhatsDinnerTonight: "{{ response }}"
    CuliplanGetWeekMeals: "This week you have {{ slots.totalMealsPlanned }} meals planned."
    CuliplanGetShoppingList: "{{ response }}"
    CuliplanAddToShoppingList: "Added {{ slots.item }} to your shopping list."
    CuliplanAddToPantry: "Added {{ slots.item }} to your pantry."
    CuliplanWhatsInPantry: "{{ response }}"
    CuliplanWhatsExpiringSoon: "{{ response }}"
    CuliplanNextCookingStep: "Moving to the next cooking step."
    CuliplanSetRecipeTimer: "Starting the {{ slots.label }} timer."
    CuliplanCancelRecipeTimer: "Cancelled the {{ slots.label }} timer."
